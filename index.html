<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omkar | Developer Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0d0e;
      color: #b0b0b0;
      font-family: 'Courier New', Courier, monospace;
      padding: 24px;
      line-height: 1.6;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }
    .logo { color: #fff; font-weight: bold; font-size: 1.1rem; }
    .nav-links a {
      color: #777;
      text-decoration: none;
      margin-left: 15px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .nav-links a.active { color: #a3e635; border-bottom: 2px solid #a3e635; }
    .roles { margin-bottom: 35px; font-size: 1.05rem; }
    .roles span { margin-right: 15px; }
    .green { color: #a3e635; font-weight: bold; }
    .terminal-section { margin-bottom: 35px; }
    .line { margin: 8px 0; font-size: 1.05rem; }
    .prompt { color: #777; margin-right: 8px; }
    .links {
      display: flex;
      gap: 20px;
      margin-top: 25px;
      font-size: 0.95rem;
    }
    .links a {
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .links a:hover { color: #a3e635; }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background-color: #a3e635;
      animation: blink 1s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
</head>
<body>

  <div class="nav">
    <div class="logo">omkar.dev</div>
    <div class="nav-links">
      <a href="#" class="active">HOME</a>
      <a href="#">ABOUT</a>
      <a href="#">PROJECTS</a>
      <a href="#">CONTACT</a>
    </div>
  </div>

  <div class="roles">
    <span class="green">&gt; developer</span>
    <span>analyst</span>
    <span>tech enthusiast</span>
  </div>

  <div class="terminal-section">
    <div class="line">
      <span class="prompt">$</span><span>whoami</span>
      &nbsp;&nbsp;&nbsp;&nbsp;<span class="green">omkar</span>
    </div>
    <div class="line">
      <span class="prompt">$</span><span>location</span>
      &nbsp;&nbsp;<span style="color: #eee;">navi mumbai, india</span><span class="cursor"></span>
    </div>
  </div>

  <div class="links">
    <a href="https://github.com/omkarrrrr800" target="_blank">● github</a>
    <a href="https://linkedin.com" target="_blank"><b style="background:#fff; color:#000; padding: 0 4px; border-radius: 2px;">in</b> linkedin</a>
    <a href="mailto:omkar@example.com">✉ email</a>
  </div>

</body>
</html>
